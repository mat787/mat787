<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420">
  <defs>
    <style>
      .cloud { fill-opacity: 0.18; stroke-width: 2; }
      .node { fill: #fff; stroke: #333; stroke-width: 2; }
      .lbl { font: 14px sans-serif; fill: #222; }
      .sm { font: 12px sans-serif; fill: #444; }
      .ip { font: 11px monospace; fill: #333; }
      .line { stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Internet -->
  <ellipse class="cloud" cx="360" cy="90" rx="130" ry="48" fill="#4da3ff" stroke="#1a6fd1"/>
  <text class="lbl" x="360" y="94" text-anchor="middle">Internet</text>

  <!-- ADM / ZeroTier -->
  <ellipse class="cloud" cx="360" cy="300" rx="150" ry="55" fill="#7ecf7e" stroke="#2d8a2d"/>
  <text class="lbl" x="360" y="288" text-anchor="middle">ADM / ZeroTier</text>
  <text class="sm" x="360" y="308" text-anchor="middle">10.80.108.0/24</text>
  <text class="ip" x="360" y="326" text-anchor="middle">NetID: 8d1c312afa9a3adc</text>

  <!-- Nodes -->
  <circle class="node" cx="120" cy="170" r="34"/>
  <text class="lbl" x="120" y="175" text-anchor="middle">sX</text>
  <text class="sm" x="120" y="218" text-anchor="middle">stacja s2</text>

  <circle class="node" cx="120" cy="330" r="34"/>
  <text class="lbl" x="120" y="335" text-anchor="middle">Lap</text>
  <text class="sm" x="120" y="378" text-anchor="middle">MacBook</text>

  <circle class="node" cx="600" cy="200" r="34"/>
  <text class="lbl" x="600" y="205" text-anchor="middle">VPS</text>
  <text class="sm" x="600" y="248" text-anchor="middle">Azure Arch</text>

  <!-- Blue path sX - Internet - VPS -->
  <line class="line" stroke="#1a6fd1" x1="154" y1="165" x2="250" y2="105"/>
  <line class="line" stroke="#1a6fd1" x1="470" y1="105" x2="566" y2="175"/>
  <circle fill="#1a6fd1" cx="200" cy="130" r="6"/>
  <circle fill="#1a6fd1" cx="520" cy="130" r="6"/>
  <text class="ip" x="360" y="132" text-anchor="middle">vps = 74.248.150.53</text>

  <!-- Green path Lap - ADM - VPS -->
  <line class="line" stroke="#2d8a2d" x1="154" y1="325" x2="250" y2="300"/>
  <line class="line" stroke="#2d8a2d" x1="470" y1="300" x2="580" y2="240"/>
  <circle fill="#2d8a2d" cx="200" cy="310" r="6"/>
  <circle fill="#2d8a2d" cx="530" cy="265" r="6"/>
  <text class="ip" x="360" y="352" text-anchor="middle">vps.adm = 10.80.108.71</text>
  <text class="ip" x="360" y="368" text-anchor="middle">lap.adm = 10.80.108.105</text>
</svg>
